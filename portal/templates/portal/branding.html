{% extends 'portal/base.html' %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow border border-gray-200">
    <h2 class="text-xl font-bold text-purple-950 mb-4">Portal Branding & School Contact Settings</h2>

    <form method="POST" enctype="multipart/form-data" class="space-y-4 text-xs">
        {% csrf_token %}
        
        <div>
            <label class="block font-bold text-gray-700 mb-1">School Name</label>
            <input type="text" name="school_name" value="{{ branding.school_name }}" class="w-full p-2 border rounded">
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-1">Tagline / Subtext</label>
            <input type="text" name="logo_text" value="{{ branding.logo_text }}" class="w-full p-2 border rounded">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Contact Phone</label>
                <input type="text" name="contact_phone" value="{{ branding.contact_phone }}" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Contact Email</label>
                <input type="email" name="contact_email" value="{{ branding.contact_email }}" class="w-full p-2 border rounded">
            </div>
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-1">School Physical Address</label>
            <input type="text" name="address" value="{{ branding.address }}" class="w-full p-2 border rounded">
        </div>

        <div>
            <label class="block font-bold text-gray-700 mb-1">Upload School Logo</label>
            <input type="file" name="logo_image" accept="image/*" class="w-full p-1 border rounded bg-white">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Primary Color</label>
                <input type="color" name="primary_color" value="{{ branding.primary_color }}" class="w-full h-10 border rounded p-1">
            </div>
            <div>
                <label class="block font-bold text-gray-700 mb-1">Secondary Color</label>
                <input type="color" name="secondary_color" value="{{ branding.secondary_color }}" class="w-full h-10 border rounded p-1">
            </div>
        </div>

        <button type="submit" class="w-full py-2 bg-purple-900 text-white font-bold rounded hover:bg-purple-950">Save Branding Settings</button>
    </form>
</div>
{% endblock %}
