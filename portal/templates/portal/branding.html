{% extends 'portal/base.html' %}
{% block content %}
<h3 class="mb-3">Branding Settings</h3>
<div class="card shadow col-md-6">
  <div class="card-body">
    <form method="POST">
      {% csrf_token %}
      <div class="form-group mb-3">
        <label>School Name</label>
        <input type="text" name="school_name" class="form-control" value="{{ branding.school_name }}">
      </div>
      <div class="form-group mb-3">
        <label>Primary Color</label>
        <input type="color" name="primary_color" class="form-control" value="{{ branding.primary_color }}">
      </div>
      <div class="form-group mb-3">
        <label>Secondary Color</label>
        <input type="color" name="secondary_color" class="form-control" value="{{ branding.secondary_color }}">
      </div>
      <button type="submit" class="btn btn-primary">Save Settings</button>
    </form>
  </div>
</div>
{% endblock %}
