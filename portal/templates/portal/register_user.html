{% extends 'base.html' %}

{% block content %}
<div style="max-width: 600px; margin: 30px auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2>Register New User</h2>
    <form method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>Username / Login ID</label>
            <input type="text" name="username" class="form-control" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>First Name</label>
            <input type="text" name="first_name" class="form-control" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Last Name</label>
            <input type="text" name="last_name" class="form-control" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <div style="margin-bottom: 15px;">
            <label>Password</label>
            <input type="password" name="password" class="form-control" required style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        {% if current_profile.role == 'ADMIN' %}
        <div style="margin-bottom: 15px;">
            <label>Role</label>
            <select name="role" class="form-control" style="width: 100%; padding: 8px; margin-top: 5px;">
                <option value="STUDENT">Student</option>
                <option value="TEACHER">Teacher</option>
                <option value="ADMIN">Admin</option>
            </select>
        </div>

        <div style="margin-bottom: 15px;">
            <label>Assigned Academic Class</label>
            <select name="academic_class" class="form-control" style="width: 100%; padding: 8px; margin-top: 5px;">
                <option value="">-- None --</option>
                {% for c in classes %}
                    <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>
        {% else %}
        <!-- Teacher registering a student -->
        <input type="hidden" name="role" value="STUDENT">
        <p><strong>Assigned Class:</strong> {{ current_profile.assigned_class.name }}</p>
        {% endif %}

        <div style="margin-bottom: 15px;">
            <label>Index / Student ID Number</label>
            <input type="text" name="index_number" class="form-control" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <button type="submit" style="background: #800020; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Register User</button>
    </form>
</div>
{% endblock %}
