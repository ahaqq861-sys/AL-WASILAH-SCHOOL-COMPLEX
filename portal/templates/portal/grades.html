{% extends 'portal/base.html' %}
{% block content %}
<h3 class="mb-3">Gradebook</h3>
<div class="card shadow">
  <div class="card-body">
    <table class="table table-striped">
      <thead><tr><th>Student</th><th>Subject</th><th>Term</th><th>Score</th></tr></thead>
      <tbody>
        {% for g in grades %}
        <tr><td>{{ g.student.username }}</td><td>{{ g.subject }}</td><td>{{ g.term }}</td><td>{{ g.score }}</td></tr>
        {% empty %}<tr><td colspan="4">No grades recorded yet.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
