<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL-WASILAH School Complex | Portal Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #ffffff; width: 100%; max-width: 420px; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .login-card h2 { text-align: center; color: #1e293b; margin-bottom: 0.2rem; font-size: 1.6rem; }
        .login-card p { text-align: center; color: #64748b; font-size: 0.9rem; margin-bottom: 1.8rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; color: #334155; font-size: 0.9rem; font-weight: 600; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; background: #f8fafc; }
        .form-group input:focus, .form-group select:focus { border-color: #2563eb; background: #ffffff; }
        .btn-submit { width: 100%; padding: 0.85rem; background-color: #1e3a8a; color: #ffffff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .alert { background: #fef2f2; color: #991b1b; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.85rem; text-align: center; border: 1px solid #fecaca; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>AL-WASILAH PORTAL</h2>
    <p>Select your portal role and sign in</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="role">Portal Access Role</label>
            <select name="role" id="role" required>
                <option value="student">Student Portal</option>
                <option value="teacher">Teacher Portal</option>
                <option value="admin">Administrator Portal</option>
            </select>
        </div>
        <div class="form-group">
            <label for="username">Username / Student ID</label>
            <input type="text" name="username" id="username" required placeholder="Enter your ID or username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-submit">Sign In to Portal</button>
    </form>
</div>

</body>
</html>
