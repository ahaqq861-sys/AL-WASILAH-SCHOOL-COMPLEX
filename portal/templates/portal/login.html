<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ branding.school_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-lg border border-gray-200 w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-purple-950">{{ branding.school_name }}</h1>
            <p class="text-xs text-gray-500 font-semibold">{{ branding.logo_text }}</p>
        </div>

        {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
            <p class="p-2 text-xs text-red-700 bg-red-100 border border-red-200 rounded">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Username</label>
                <input type="text" name="username" required class="w-full p-2.5 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-purple-900">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-2.5 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-purple-900">
            </div>
            <button type="submit" class="w-full py-2.5 bg-purple-900 text-white font-bold rounded text-xs hover:bg-purple-950 transition">Log In</button>
        </form>
    </div>
</body>
</html>
