<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Al-Wasilah Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-purple-950 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-lg shadow-xl p-6">
        <h2 class="text-2xl font-extrabold text-purple-900 text-center">Al-Wasilah Portal</h2>
        <p class="text-xs text-gray-500 text-center mt-1 mb-6">Enter your registered credentials to access your account</p>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Username</label>
                <input type="text" name="username" required class="w-full p-2.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-purple-800">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                <input type="password" name="password" required class="w-full p-2.5 border border-gray-300 rounded text-sm focus:outline-none focus:border-purple-800">
            </div>
            <button type="submit" class="w-full py-2.5 bg-purple-900 text-white font-bold rounded text-sm hover:bg-purple-950 transition">Log In</button>
        </form>
    </div>
</body>
</html>
