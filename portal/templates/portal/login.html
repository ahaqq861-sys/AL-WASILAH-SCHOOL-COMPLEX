<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ branding.school_name }} | Portal Sign In</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: linear-gradient(135deg, {{ branding.primary_color }} 0%, {{ branding.secondary_color }} 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .login-wrapper { background: #ffffff; width: 100%; max-width: 440px; border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,0.35); overflow: hidden; }
        .login-header { background: {{ branding.primary_color }}; color: white; padding: 2rem 1.5rem; text-align: center; border-bottom: 3px solid #d4af37; }
        .logo-img { max-height: 75px; margin-bottom: 0.75rem; object-fit: contain; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
        .login-header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .login-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.2rem; }
        .login-body { padding: 2rem 1.75rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin-bottom: 0.4rem; }
        .form-group input, .form-group select { width: 100%; padding: 0.75rem 0.9rem; border: 1.5px solid #e2e8f0; border-radius: 6px; font-size: 0.95rem; transition: 0.2s; background-color: #f8fafc; }
        .form-group input:focus, .form-group select:focus { border-color: {{ branding.primary_color }}; outline: none; background-color: #fff; box-shadow: 0 0 0 3px rgba(114, 47, 55, 0.15); }
        .btn-submit { width: 100%; padding: 0.85rem; background: {{ branding.primary_color }}; color: white; border: none; border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 0.5rem; }
        .btn-submit:hover { background: {{ branding.secondary_color }}; }
        .alert { background: #fff5f5; color: #c53030; border: 1px solid #feb2b2; padding: 0.75rem; border-radius: 6px; margin-bottom: 1.25rem; font-size: 0.85rem; text-align: center; }
        .login-footer { background: #f8fafc; padding: 1rem; border-top: 1px solid #edf2f7; text-align: center; font-size: 0.8rem; color: #718096; line-height: 1.5; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-header">
        {% if branding.logo %}
            <img src="{{ branding.logo.url }}" alt="School Logo" class="logo-img">
        {% endif %}
        <h1>{{ branding.school_name }}</h1>
        <p>{{ branding.tagline }}</p>
    </div>

    <div class="login-body">
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="role">Portal Access Role</label>
                <select name="role" id="role" required>
                    <option value="student">Student Portal</option>
                    <option value="teacher">Teacher Portal</option>
                    <option value="admin">Administrator Portal</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">Username / Student ID / Employee ID</label>
                <input type="text" name="username" id="username" required placeholder="Enter credentials">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-submit">Sign In to Account</button>
        </form>
    </div>

    <div class="login-footer">
        <strong>Contact Support:</strong> {{ branding.phone_number }} | {{ branding.email_address }}<br>
        <span>{{ branding.address }}</span>
    </div>
</div>

</body>
</html>
