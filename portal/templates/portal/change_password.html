{% extends 'portal/base.html' %}

{% block content %}
<div style="max-width: 450px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; border: 1px solid #ddd;">
    <h3 style="margin-top:0;">Update Permanent Password</h3>
    <p style="color: #666; font-size: 14px;">For security, you must change your temporary default password before proceeding.</p>

    <form method="POST">
        {% csrf_token %}
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            {{ form.as_p }}
        </div>
        <button type="submit" style="margin-top: 15px; width: 100%; padding: 10px; background-color: {{ branding.primary_color|default:'#800020' }}; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Save Permanent Password
        </button>
    </form>
</div>
{% endblock %}
