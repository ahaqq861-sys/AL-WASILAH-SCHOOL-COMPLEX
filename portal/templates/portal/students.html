{% extends 'base.html' %}
{% block content %}
<h2>Student Directory</h2>
<table class="table table-striped mt-3">
  <thead><tr><th>Username</th><th>Role</th><th>Phone</th></tr></thead>
  <tbody>
    {% for s in students %}
    <tr><td>{{ s.user.username }}</td><td>{{ s.role }}</td><td>{{ s.phone|default:"N/A" }}</td></tr>
    {% empty %}<tr><td colspan="3">No records found.</td></tr>{% endfor %}
  </tbody>
</table>
{% endblock %}
