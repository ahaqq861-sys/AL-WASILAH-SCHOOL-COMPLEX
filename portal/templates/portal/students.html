{% extends 'portal/base.html' %}
{% block content %}
<h3 class="mb-3">Student Directory</h3>
<div class="card shadow">
  <div class="card-body">
    <table class="table table-striped">
      <thead><tr><th>Username</th><th>Role</th><th>Phone</th></tr></thead>
      <tbody>
        {% for s in students %}
        <tr><td>{{ s.user.username }}</td><td>{{ s.role }}</td><td>{{ s.phone|default:"N/A" }}</td></tr>
        {% empty %}<tr><td colspan="3">No student records found.</td></tr>{% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
