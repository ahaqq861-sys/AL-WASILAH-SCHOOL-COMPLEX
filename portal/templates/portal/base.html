<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Al-Wasilah School Complex{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .bg-wine { background-color: #722F37; }
        .bg-wine-dark { background-color: #4A1521; }
        .text-wine { color: #722F37; }
        .border-wine { border-color: #722F37; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col">

    <header class="bg-wine text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-6 py-6 text-center">
            <h1 class="text-3xl font-extrabold tracking-wide">AL-WASILAH SCHOOL COMPLEX</h1>
            <p class="text-gray-200 mt-1">School Management & Academic Reporting Portal</p>
        </div>
    </header>

    <nav class="bg-wine-dark text-white border-b border-red-900">
        <div class="max-w-7xl mx-auto px-6 flex flex-wrap justify-between items-center">
            <div class="flex space-x-1 sm:space-x-4 py-3 text-sm font-medium">
                <a href="{% url 'portal:portal_dashboard' %}" class="px-3 py-2 rounded hover:bg-wine transition">
                    <i class="fas fa-chart-line mr-1"></i> Dashboard
                </a>
                <a href="{% url 'portal:student_directory' %}" class="px-3 py-2 rounded hover:bg-wine transition">
                    <i class="fas fa-user-graduate mr-1"></i> Directory
                </a>
                <a href="{% url 'portal:grade_portal' %}" class="px-3 py-2 rounded hover:bg-wine transition">
                    <i class="fas fa-pen-nib mr-1"></i> Trimester Grades
                </a>
                <a href="{% url 'portal:fee_admin' %}" class="px-3 py-2 rounded hover:bg-wine transition">
                    <i class="fas fa-wallet mr-1"></i> Fees
                </a>
                <a href="{% url 'portal:promotion_management' %}" class="px-3 py-2 rounded hover:bg-wine transition">
                    <i class="fas fa-arrow-up-right-dots mr-1"></i> Promotions
                </a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm text-green-800 bg-green-100 rounded-lg border border-green-200" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <main class="max-w-7xl mx-auto px-6 py-6 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-900 text-white py-4 text-center text-xs mt-auto">
        &copy; Al-Wasilah School Complex | All Rights Reserved
    </footer>

</body>
</html>
